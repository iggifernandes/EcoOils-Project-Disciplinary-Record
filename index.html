:root{

  --font:Jost,system-ui,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);overflow-x:hidden}
button,input,select,textarea{font-family:var(--font)}
.dots-wm{position:fixed;right:-45px;bottom:-45px;width:150px;height:150px;opacity:.3;z-index:0;pointer-events:none;background:var(--dots) center/contain no-repeat}
header,nav,main,.ptitle{position:relative;z-index:1;max-width:780px;margin:0 auto}
header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 16px 0}
.brand{color:var(--grey2);font-size:13px;letter-spacing:.04em;line-height:1.35;padding-top:2px}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ver{font-size:13px;color:var(--grey2);font-variant-numeric:tabular-nums}
.lang{display:inline-flex;gap:2px}
.lang button{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--ink);padding:6px 9px;font-weight:500;cursor:pointer;font-size:15px;min-height:36px}
.lang button.on{border-color:var(--green)}
.ptitle{padding:26px 16px 14px;border-bottom:1px solid var(--black);margin-bottom:18px}
.ptitle:after{content:"";position:absolute;left:16px;bottom:-4px;width:44px;height:7px;background:var(--green)}
.ptitle h1{margin:0;font-weight:300;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#6e6b6c}
nav{display:flex;flex-wrap:wrap;gap:0 4px;padding:0 10px;margin-bottom:6px}
nav button{border:0;background:none;color:var(--ink);padding:10px 8px;cursor:pointer;font-weight:400;font-size:15px;border-bottom:3px solid transparent;min-height:44px}
nav button.on{border-color:var(--green);font-weight:500}
main{padding:10px 16px 150px}
section.tab{display:none}section.tab.on{display:block}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--grey2)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;border-left:5px solid var(--line)}
.kpi b{display:block;font-size:30px;font-weight:300;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:14px}
.k1{border-left-color:var(--grey)}.k2{border-left-color:var(--yellow)}.k3{border-left-color:var(--black)}.kz{border-left-color:var(--grey2)}.kb{border-left-color:var(--green)}
.two{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--chip);color:var(--black)}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.b1:before{background:var(--grey)}.b2{background:var(--sp2b)}.b2:before{background:var(--yellow)}
.b3{background:var(--black);color:#fff}.b3:before{background:#fff}
.bZT{background:#fff;border:1px dashed var(--black)}.bZT:before{background:var(--grey2)}
.st{font-size:13px;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--mut);display:inline-block;line-height:1.35}
.st.ok{color:var(--black);background:#e6f3ec}
.st.skipped,.st.phk{color:var(--black);background:var(--yellow);font-weight:500}
.st.repeat{color:var(--black);background:var(--sp2b)}
.st.zt{color:var(--black);background:var(--ztb)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.bar .lbl{width:110px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{flex:1;display:flex;height:14px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar .trk i{display:block;height:100%}
.bar .n{width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.s1{background:var(--grey)}.s2{background:var(--yellow)}.s3{background:var(--black)}.sZT{background:var(--grey2)}
.months{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:6px}
.months div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;font-size:11px;text-align:center;color:var(--mut);min-width:0}
.months .st-col{display:flex;flex-direction:column-reverse;border-radius:2px;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.tw{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--grey2);background:#fff;white-space:nowrap}
td.v{min-width:200px;max-width:300px;white-space:pre-wrap}
.bar-f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select,textarea{font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
.bar-f input,.bar-f select{width:auto;flex:1;min-width:130px}
textarea{min-height:96px;resize:vertical}
label{display:block;font-size:14px;font-weight:500;color:var(--grey2);margin-bottom:4px}
label i{color:var(--black);font-style:normal}
.f2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.full{grid-column:1/-1}
button.btn{background:var(--green);color:var(--black);border:1px solid var(--green);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:15px;min-height:44px;transition:opacity .15s}
button.btn:hover{opacity:.88}
button.btn.sec,button.btn.dng{background:#fff;color:var(--black);border:1px solid var(--grey);font-weight:500}
button.btn.y{background:var(--yellow);border-color:var(--yellow)}
button.btn.sm{padding:4px 10px;font-size:13px;min-height:34px}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reco{border-radius:8px;padding:10px 12px;margin:12px 0;border:1px solid var(--line);border-left:5px solid var(--grey);background:#fafafa;font-size:15px}
.reco.r1{border-left-color:var(--grey)}.reco.r2{border-left-color:var(--yellow);background:#fffbe6}.reco.r3,.reco.rp{border-left-color:var(--black);background:#fff3bf}
.muted{color:var(--mut);font-size:14px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:14px}
.wk{display:grid;grid-template-columns:260px 1fr;gap:14px}
@media(max-width:900px){.wk{grid-template-columns:1fr}}
.wlist{max-height:60vh;overflow:auto}
.wi{padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:44px}
.wi:hover,.wi.on{background:var(--chip)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl>div{position:relative;margin-bottom:14px}
.tl>div:before{content:"";position:absolute;left:-21px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid #fff}
.legal h3{margin:18px 0 6px;font-size:16px;font-weight:600}
.legal .cite{border-left:4px solid var(--green);padding:6px 12px;margin:8px 0;background:var(--chip);border-radius:0 8px 8px 0;font-size:15px}
.legal .cite b{display:block;font-weight:500}
.legal ul{margin:6px 0;padding-left:20px}
.legal a{color:var(--black)}
.note{border-left:5px solid var(--yellow);padding:10px 12px;background:#fffbe6;font-size:15px;margin:10px 0;border-radius:0 8px 8px 0}
.empty{text-align:center;padding:34px 12px;color:var(--grey);text-transform:uppercase;letter-spacing:.12em;font-weight:300;font-size:14px}
.empty i{display:block;width:56px;height:56px;margin:0 auto 12px;background:var(--dots) center/contain no-repeat}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 16px;border-radius:8px;font-size:15px;z-index:50;display:none;max-width:90vw}
#lm{display:none;position:fixed;inset:0;background:rgba(35,31,32,.7);z-index:40;overflow:auto;padding:14px}
#lm.on{display:block}
.lm-bar{max-width:210mm;margin:0 auto 10px;background:#fff;padding:10px 12px;border-radius:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lm-bar select{width:auto}
.sheet{width:210mm;max-width:100%;margin:0 auto;background:#fff;color:#000;padding:16mm 16mm 12mm;font:400 10.5pt/1.32 var(--font)}
.sheet .lh{text-align:center;border-bottom:1px solid #000;padding-bottom:6px;margin-bottom:10px;position:relative}
.sheet .lh b{font-size:14pt;font-weight:500;letter-spacing:.14em}
.sheet .lh div{font-size:9.5pt}
.sheet h2{text-align:center;font-size:12.5pt;font-weight:500;letter-spacing:.06em;margin:6px 0 2px;color:#000;text-transform:none}
.sheet .no{text-align:center;font-size:10pt;margin-bottom:10px}
.sheet table{font-size:10.5pt;margin:6px 0}
.sheet td,.sheet th{border:0;padding:2px 6px 2px 0;color:#000;background:none;text-transform:none;letter-spacing:0;font-size:10.5pt;font-weight:400}
.sheet td:first-child{width:36%}
.sheet p{margin:4px 0;text-align:justify}
.sheet p.en{font-style:italic;font-size:10pt;color:#222;margin-top:0}
.sheet .box{border:1.5px solid #000;padding:6px 10px;margin:8px 0;white-space:pre-wrap}
.sheet .sig{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;font-size:9.5pt;text-align:center}
.sheet .sig div{min-height:70px}
.sheet .sig span{display:block;border-top:1px solid #000;margin-top:40px;padding-top:2px}
.sheet .foot{font-size:8.5pt;border-top:1px solid #000;margin-top:12px;padding-top:4px;color:#222}
@media(max-width:600px){
  .ptitle{padding:22px 16px 12px}.ptitle h1{font-size:18px;letter-spacing:.1em}
  nav button,.lang button{font-size:14px}.bar .lbl{width:84px}
  .sheet{padding:10mm 6mm}.sheet .sig{grid-template-columns:repeat(2,1fr)}}
@media print{
  body>*:not(#lm){display:none!important}
  #lm{position:static;background:none;padding:0;display:block!important}
  .lm-bar{display:none!important}
  .dots-wm{display:none!important}
  .sheet{box-shadow:none;width:auto;padding:0;margin:0}
  @page{size:A4;margin:12mm}
}
</style>

const t=(k,v)=>{let s=(T[S.settings.lang]||T.en)[k];if(s==null)s=T.en[k]||k;if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const emptyHTML=()=>'<div class="empty"><i></i>'+esc(t("none"))+"</div>";

function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",3200)}

/* ---------- dates ---------- */
const pad=(n,l=2)=>String(n).padStart(l,"0");
const iso=(y,m,d)=>y+"-"+pad(m)+"-"+pad(d);
const todayStr=()=>{const d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())};
function addMonths(s,m){const [y,mo,d]=s.split("-").map(Number);const tt=mo-1+m;const ny=y+Math.floor(tt/12),nm=((tt%12)+12)%12;const dim=new Date(Date.UTC(ny,nm+1,0)).getUTCDate();return iso(ny,nm+1,Math.min(d,dim))}
function addDays(s,n){const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
const lastValid=s=>addDays(addMonths(s,+S.settings.months||6),-1);
function fmt(s){if(!s)return"";const [y,m,d]=s.split("-");return d+" "+MONTHS[S.settings.lang][+m-1]+" "+y}

/* ---------- analysis (SP ladder) ---------- */
const norm=s=>String(s||"").toLowerCase().replace(/\s+/g," ").trim();
function wkey(r){const id=String(r.empId||"").trim();if(id.length>=3&&!/^[-–—.\s]*$/.test(id)&&!/^(n\/?a|none|tidak ada)$/i.test(id))return"I:"+id.toLowerCase().replace(/\s+/g,"");return"N:"+norm(r.name)}
function analyze(){
  if(A)return A;
  const groups=new Map(),info=new Map(),workers=[],today=todayStr();
  S.records.forEach(r=>{const k=wkey(r);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});
  groups.forEach((arr,k)=>{
    arr.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
    arr.forEach((r,i)=>{
      let maxA=0;
      for(let j=0;j<i;j++){const p=arr[j];if(p.level!=="ZT"&&p.date<r.date&&r.date<=lastValid(p.date))maxA=Math.max(maxA,+p.level)}
      const exp=Math.min(3,maxA+1);let status;
      if(r.level==="ZT")status="zt";
      else if(maxA===3&&r.level==="3")status="phk";
      else if(+r.level===exp)status="ok";
      else if(+r.level>exp)status="skipped";else status="repeat";
      const until=lastValid(r.date);
      info.set(r.id,{key:k,exp,status,until,active:r.date<=today&&today<=until});
    });
    let cur=0,curRec=null,zt=0;
    arr.forEach(r=>{if(r.level==="ZT"){zt++;return}const i=info.get(r.id);if(i.active&&(+r.level>cur||(+r.level===cur&&r.date>curRec.date))){cur=+r.level;curRec=r}});
    const last=arr[arr.length-1];
    let co="";for(let i=arr.length-1;i>=0;i--)if(arr[i].company){co=arr[i].company;break}
    workers.push({key:k,name:last.name,empId:last.empId,company:co,position:last.position,recs:arr,total:arr.length,cur,curUntil:curRec?info.get(curRec.id).until:"",curDate:curRec?curRec.date:"",zt,lastDate:last.date});
  });
  A={info,workers,byKey:new Map(workers.map(w=>[w.key,w]))};return A;
}
function recommend(key,date,excludeId){
  let best=null,maxA=0;
  S.records.forEach(r=>{if(r.id===excludeId||r.level==="ZT"||wkey(r)!==key)return;if(r.date<date&&date<=lastValid(r.date)&&(+r.level>maxA||(+r.level===maxA&&r.date>best.date))){maxA=+r.level;best=r}});
  return{maxA,best,next:Math.min(3,maxA+1),phk:maxA===3};
}
function category(v){v=String(v||"").toLowerCase();
  if(/glass|kacamata|eye/.test(v))return"glasses";if(/smok|rokok|merokok/.test(v))return"smoking";
  if(/permit|ptw|izin kerja/.test(v))return"permit";if(/height|harness|ketinggian|scaffold|lifeline/.test(v))return"height";
  if(/vehicle|truck|driver|flagman|speed|forklift|crane|tmc|rigger|lifting|kendaraan|sling/.test(v))return"vehicle";
  if(/ppe|apd|helmet|vest|glove|boot|trouser|sepatu|rompi|sarung|torn/.test(v))return"ppe";return"other"}
const lvLabel=l=>l==="ZT"?"ZT":"SP"+l;
const badge=l=>'<span class="badge b'+l+'">'+lvLabel(l)+"</span>";
function chk(r){const i=analyze().info.get(r.id);if(!i)return"";let txt=t("st_"+i.status);
  if(i.status==="skipped")txt=t("st_skipped_d",{n:r.level,e:i.exp});if(i.status==="repeat")txt=t("st_repeat_d",{e:i.exp});
  return'<span class="st '+i.status+'">'+esc(txt)+"</span>"}

/* ---------- dashboard ---------- */
function stackBar(counts,max){return'<span class="trk">'+["1","2","3","ZT"].map(l=>counts[l]?'<i class="s'+l+'" style="width:'+(counts[l]/max*100)+'%" title="'+lvLabel(l)+': '+counts[l]+'"></i>':"").join("")+"</span>"}
function rDash(){
  const a=analyze(),R=S.records,el=$("#tab-dash");
  if(!R.length){el.innerHTML=emptyHTML();return}
  const w1=a.workers.filter(w=>w.cur===1).length,w2=a.workers.filter(w=>w.cur===2).length,w3=a.workers.filter(w=>w.cur===3).length;
  const zt=R.filter(r=>r.level==="ZT").length,flags=R.filter(r=>{const s=a.info.get(r.id).status;return s==="skipped"||s==="repeat"||s==="phk"}).length;
  const kp=(c,n,l)=>'<div class="kpi '+c+'"><b>'+n+"</b><span>"+esc(t(l))+"</span></div>";
  let h='<div class="grid kpis" style="margin-bottom:14px">'+kp("kb",R.length,"k_total")+kp("kb",a.workers.length,"k_workers")+kp("k1",w1,"k_sp1")+kp("k2",w2,"k_sp2")+kp("k3",w3,"k_sp3")+kp("kz",zt,"k_zt")+kp("kb",flags,"k_flag")+"</div>";
  // company
  const byCo={};R.forEach(r=>{const c=r.company||"—";(byCo[c]=byCo[c]||{n:0})[r.level]=(byCo[c][r.level]||0)+1;byCo[c].n++});
  const coList=Object.entries(byCo).sort((x,y)=>y[1].n-x[1].n),mx=coList[0][1].n;
  const legend='<div class="legend"><span><i class="s1"></i>SP1</span><span><i class="s2"></i>SP2</span><span><i class="s3"></i>SP3</span><span><i class="sZT"></i>ZT</span></div>';
  const coH=coList.map(([c,o])=>'<div class="bar"><span class="lbl">'+esc(c)+"</span>"+stackBar(o,mx)+'<span class="n">'+o.n+"</span></div>").join("")+legend;
  // months
  const now=new Date(),ms=[];for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push({k:d.getFullYear()+"-"+pad(d.getMonth()+1),m:d.getMonth(),c:{},n:0})}
  R.forEach(r=>{const m=ms.find(x=>x.k===r.date.slice(0,7));if(m){m.c[r.level]=(m.c[r.level]||0)+1;m.n++}});
  const mmx=Math.max(1,...ms.map(m=>m.n));
  const moH='<div class="months">'+ms.map(m=>'<div title="'+m.k+': '+m.n+'"><span>'+(m.n||"")+'</span><span class="st-col" style="height:'+(m.n/mmx*100)+'%">'+["1","2","3","ZT"].map(l=>m.c[l]?'<i class="s'+l+'" style="height:'+(m.c[l]/m.n*100)+'%;display:block"></i>':"").join("")+"</span><span>"+MONTHS[S.settings.lang][m.m]+"</span></div>").join("")+"</div>"+legend;
  // categories
  const byCat={};R.forEach(r=>{const c=category(r.violation);byCat[c]=(byCat[c]||0)+1});
  const catL=Object.entries(byCat).sort((x,y)=>y[1]-x[1]),cm=catL[0][1];
  const catH=catL.map(([c,n])=>'<div class="bar"><span class="lbl" title="'+esc(t("cat_"+c))+'" style="width:170px">'+esc(t("cat_"+c))+'</span><span class="trk"><i style="background:var(--acc);width:'+(n/cm*100)+'%"></i></span><span class="n">'+n+"</span></div>").join("");
  h+='<div class="grid two"><div class="card"><h2>'+esc(t("c_company"))+"</h2>"+coH+'</div><div class="card"><h2>'+esc(t("c_month"))+"</h2>"+moH+'</div></div><div class="card"><h2>'+esc(t("c_cat"))+"</h2>"+catH+"</div>";
  // watch
  const wl=a.workers.filter(w=>w.cur>=2).sort((x,y)=>y.cur-x.cur||x.curUntil.localeCompare(y.curUntil));
  h+='<div class="card"><h2>'+esc(t("watch"))+"</h2>"+(wl.length?'<div class="tw"><table><tr><th>'+esc(t("th_name"))+"</th><th>"+esc(t("th_id"))+"</th><th>"+esc(t("th_co"))+"</th><th>"+esc(t("th_cur"))+"</th><th>"+esc(t("th_until"))+"</th></tr>"+wl.map(w=>'<tr style="cursor:pointer" data-w="'+esc(w.key)+'"><td>'+esc(w.name)+"</td><td>"+esc(w.empId)+"</td><td>"+esc(w.company)+"</td><td>"+badge(String(w.cur))+"</td><td>"+fmt(w.curUntil)+"</td></tr>").join("")+"</table></div>":'<p class="muted">'+esc(t("watch_none"))+"</p>")+"</div>";
  el.innerHTML=h;
  el.querySelectorAll("[data-w]").forEach(tr=>tr.onclick=()=>{UI.wsel=tr.dataset.w;go("wk")});
}

/* ---------- register ---------- */
function filtered(){const a=analyze(),f=UI.f,q=norm(f.q);
  return S.records.filter(r=>{
    if(f.co&&(r.company||"")!==f.co)return false;if(f.lv&&r.level!==f.lv)return false;
    const i=a.info.get(r.id);
    if(f.chk==="flag"&&!(i.status==="skipped"||i.status==="repeat"||i.status==="phk"))return false;
    if(f.chk&&f.chk!=="flag"&&i.status!==f.chk)return false;
    if(f.active&&!i.active)return false;
    if(q&&!norm([r.name,r.empId,r.violation,r.position,r.company,r.givenBy].join(" ")).includes(q))return false;return true}
  ).sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id)}
function rReg(){
  const el=$("#tab-reg"),cos=[...new Set(S.records.map(r=>r.company).filter(Boolean))].sort(),f=UI.f;
  const lvs=[["","all_lvl"],["1","lv1"],["2","lv2"],["3","lv3"],["ZT","lvZT"]],chks=[["","all_chk"],["flag","only_flag"],["ok","st_ok"],["skipped","st_skipped"],["repeat","st_repeat"],["phk","st_phk"],["zt","st_zt"]];
  const list=filtered(),pages=Math.max(1,Math.ceil(list.length/UI.per));UI.page=Math.min(UI.page,pages);
  const rows=list.slice((UI.page-1)*UI.per,UI.page*UI.per);
  el.innerHTML='<div class="card"><div class="bar-f"><input id="fq" placeholder="'+esc(t("search"))+'" value="'+esc(f.q)+'">'

   +'<select id="flv">'+lvs.map(([v,k])=>'<option value="'+v+'"'+(f.lv===v?" selected":"")+">"+esc(t(k))+"</option>").join("")+"</select>"
   +'<select id="fck">'+chks.map(([v,k])=>'<option value="'+v+'"'+(f.chk===v?" selected":"")+">"+esc(t(k))+"</option>").join("")+"</select>"
   +'<label style="display:flex;gap:6px;align-items:center;margin:0;white-space:nowrap"><input type="checkbox" id="fac" style="width:auto"'+(f.active?" checked":"")+"> "+esc(t("only_active"))+"</label></div>"

   +(rows.length?'<div class="tw"><table><tr><th>'+["th_no","th_date","th_co","th_name","th_id","th_pos","th_lvl","th_viol","th_by","th_chk","th_act"].map(k=>"<th>"+esc(t(k))+"</th>").join("").replace(/^<th>/,"")+"</tr>"
   +rows.map(r=>"<tr><td>"+r.id+"</td><td>"+fmt(r.date)+"</td><td>"+esc(r.company)+"</td><td>"+esc(r.name)+"</td><td>"+esc(r.empId)+"</td><td>"+esc(r.position)+"</td><td>"+badge(r.level)+'</td><td class="v">'+esc(r.violation)+"</td><td>"+esc(r.givenBy)+"</td><td>"+chk(r)+'</td><td style="white-space:nowrap"><button class="btn sm sec" data-l="'+r.id+'">'+esc(t("letter"))+'</button> <button class="btn sm sec" data-e="'+r.id+'">'+esc(t("edit"))+'</button> <button class="btn sm dng" data-d="'+r.id+'">'+esc(t("del"))+"</button></td></tr>").join("")+"</table></div>":emptyHTML())
   +'<div class="pager"><button class="btn sm sec" id="pp"'+(UI.page<=1?" disabled":"")+">"+esc(t("prev"))+"</button><span>"+esc(t("page"))+" "+UI.page+" "+esc(t("of"))+" "+pages+'</span><button class="btn sm sec" id="pn"'+(UI.page>=pages?" disabled":"")+">"+esc(t("next"))+"</button></div></div>";

/* ---------- new / edit ---------- */
function rNew(){
  const el=$("#tab-new"),ed=UI.edit?S.records.find(r=>r.id===UI.edit):null;
  const r=ed||{date:todayStr(),company:"",name:"",empId:"",position:"",level:"1",violation:"",givenBy:S.settings.issuer||"",ack:"0"};
  const cos=[...new Set([...COMPANIES,...S.records.map(x=>x.company).filter(Boolean)])];
  const names=[...new Map(analyze().workers.map(w=>[w.name,w])).values()];
  el.innerHTML='<div class="card"><h2>'+esc(t(ed?"f_edit":"f_new"))+'</h2><div class="f2">'
   +'<div><label>'+esc(t("f_date"))+' <i>*</i></label><input type="date" id="nd" value="'+esc(r.date)+'"></div>'
   +'<div><label>'+esc(t("f_co"))+' <i>*</i></label><select id="nc"><option value=""></option>'+cos.map(c=>"<option"+(r.company===c?" selected":"")+">"+esc(c)+"</option>").join("")+"</select></div>"
   +'<div><label>'+esc(t("f_name"))+' <i>*</i></label><input id="nn" list="dl-n" value="'+esc(r.name)+'" autocomplete="off"><datalist id="dl-n">'+names.map(w=>'<option value="'+esc(w.name)+'">'+esc(w.empId)+"</option>").join("")+"</datalist></div>"
   +'<div><label>'+esc(t("f_id"))+' <i>*</i></label><input id="ni" value="'+esc(r.empId)+'"></div>'
   +'<div><label>'+esc(t("f_pos"))+' <i>*</i></label><input id="np" value="'+esc(r.position)+'"></div>'
   +'<div><label>'+esc(t("f_lvl"))+' <i>*</i></label><select id="nl">'+[["1","lv1"],["2","lv2"],["3","lv3"],["ZT","lvZT"]].map(([v,k])=>'<option value="'+v+'"'+(r.level===v?" selected":"")+">"+esc(t(k))+"</option>").join("")+"</select></div>"
   +'<div class="full"><div id="reco"></div></div>'
   +'<div class="full"><label>'+esc(t("f_viol"))+' <i>*</i></label><textarea id="nv">'+esc(r.violation)+"</textarea></div>"
   +'<div><label>'+esc(t("f_by"))+' <i>*</i></label><input id="nb" value="'+esc(r.givenBy)+'"></div>'
   +'<div><label>'+esc(t("f_ack"))+'</label><select id="na">'+["0","1","2"].map(v=>'<option value="'+v+'"'+((r.ack||"0")===v?" selected":"")+">"+esc(t("ack"+v))+"</option>").join("")+"</select></div></div>"
   +'<div class="row" style="margin-top:14px"><button class="btn" id="sv">'+esc(t("save"))+'</button><button class="btn sec" id="svp">'+esc(t("saveprint"))+'</button><button class="btn sec" id="cx">'+esc(t("cancel"))+"</button></div></div>";
  const key=()=>wkey({empId:$("#ni").value,name:$("#nn").value});
  function reco(){
    const n=$("#nn").value.trim(),i=$("#ni").value.trim();const box=$("#reco");
    if(!n&&!i){box.innerHTML="";return}
    const rc=recommend(key(),$("#nd").value||todayStr(),UI.edit);const lv=$("#nl").value;let cls="",msg;
    if(lv==="ZT"){cls="rp";msg=t("rec_zt")}
    else if(rc.phk){cls="rp";msg=t("rec_phk",{d:fmt(rc.best.date),u:fmt(lastValid(rc.best.date))})}
    else if(!rc.maxA){cls="r1";msg=t("rec_none")}
    else{cls="r"+rc.next;msg=t("rec_next",{a:rc.maxA,d:fmt(rc.best.date),u:fmt(lastValid(rc.best.date)),n:rc.next})}
    box.innerHTML='<div class="reco '+cls+'"><b>'+esc(t("rec_title"))+"</b><br>"+esc(msg)+(lv!=="ZT"&&!rc.phk&&+lv!==rc.next?' <button class="btn sm" id="ap">'+esc(t("apply"))+" (SP"+rc.next+")</button>":"")+"</div>";
    const ap=$("#ap");if(ap)ap.onclick=()=>{$("#nl").value=String(rc.next);reco()};
  }
  $("#nn").onchange=()=>{const w=names.find(x=>x.name===$("#nn").value);if(w&&!$("#ni").value){$("#ni").value=w.empId||"";if(!$("#np").value)$("#np").value=w.position||"";if(!$("#nc").value)$("#nc").value=w.company||""}reco()};
  ["nn","ni","nd","nl"].forEach(i=>{$("#"+i).oninput=reco;$("#"+i).onchange=i==="nn"?$("#nn").onchange:reco});reco();
  function collect(){
    const o={date:$("#nd").value,company:$("#nc").value,name:$("#nn").value.trim(),empId:$("#ni").value.trim(),position:$("#np").value.trim(),level:$("#nl").value,violation:$("#nv").value.trim(),givenBy:$("#nb").value.trim(),ack:$("#na").value};
    if(!o.date||!o.company||!o.name||!o.empId||!o.position||!o.violation||!o.givenBy){toast(t("req"));return null}return o}
  function commit(pr){const o=collect();if(!o)return;let id;
    if(ed){Object.assign(ed,o);id=ed.id}else{id=Math.max(0,...S.records.map(x=>x.id))+1;S.records.push(Object.assign({id},o))}
    UI.edit=null;save();toast(t("saved"));if(pr){go("reg");openLetter(id)}else go("reg")}
  $("#sv").onclick=()=>commit(false);$("#svp").onclick=()=>commit(true);$("#cx").onclick=()=>{UI.edit=null;go("reg")};
}

/* ---------- worker history ---------- */
function rWk(){
  const el=$("#tab-wk"),a=analyze(),q=norm(UI.wq);
  const list=a.workers.filter(w=>!q||norm(w.name+" "+w.empId+" "+w.company).includes(q)).sort((x,y)=>y.cur-x.cur||y.total-x.total||x.name.localeCompare(y.name));
  const sel=UI.wsel&&a.byKey.get(UI.wsel);
  let det='<div class="card muted">'+esc(t("w_pick"))+"</div>";
  if(sel){
    const rc=recommend(sel.key,todayStr()),cur=sel.cur?badge(String(sel.cur))+" · "+esc(t("th_until"))+" "+fmt(sel.curUntil):esc(t("w_cur_none"));
    let nx;if(rc.phk)nx=t("rec_phk",{d:fmt(rc.best.date),u:fmt(lastValid(rc.best.date))});else if(!rc.maxA)nx=t("rec_none");else nx=t("rec_next",{a:rc.maxA,d:fmt(rc.best.date),u:fmt(lastValid(rc.best.date)),n:rc.next});
    det='<div class="card"><h2>'+esc(sel.name)+'</h2><div class="muted">'+esc(sel.empId)+" · "+esc(sel.company)+" · "+esc(sel.position)+"</div>"
     +'<p><b>'+esc(t("w_cur"))+":</b> "+cur+'</p><div class="reco '+(rc.phk?"rp":"r"+rc.next)+'"><b>'+esc(t("w_next"))+":</b> "+esc(nx)+"</div>"
     +"<h2>"+esc(t("w_hist"))+'</h2><div class="tl">'+sel.recs.slice().reverse().map(r=>{const i=a.info.get(r.id);
       return"<div><b>"+fmt(r.date)+"</b> "+badge(r.level)+" "+chk(r)+'<br><span class="muted">'+(r.level==="ZT"?"":esc(t("w_valid",{a:fmt(r.date),b:fmt(i.until)}))+" · "+esc(t(i.active?"w_active":"w_expired")))+"</span><br>"+esc(r.violation).replace(/\n/g,"<br>")+'<br><span class="muted">'+esc(t("th_by"))+": "+esc(r.givenBy)+'</span> <button class="btn sm sec" data-l="'+r.id+'">'+esc(t("letter"))+"</button></div>"}).join("")+"</div></div>";
  }
  el.innerHTML='<div class="wk"><div class="card"><input id="wq" placeholder="'+esc(t("w_search"))+'" value="'+esc(UI.wq)+'" style="margin-bottom:8px"><div class="wlist">'
   +list.slice(0,300).map(w=>'<div class="wi'+(w.key===UI.wsel?" on":"")+'" data-k="'+esc(w.key)+'"><span><b>'+esc(w.name)+'</b><br><span class="muted">'+esc(w.empId)+" · "+esc(w.company)+"</span></span><span>"+(w.cur?badge(String(w.cur)):'<span class="muted">'+w.total+"</span>")+"</span></div>").join("")+"</div></div><div>"+det+"</div></div>";
  $("#wq").oninput=e=>{UI.wq=e.target.value;const p=e.target.selectionStart;rWk();const n=$("#wq");n.focus();n.setSelectionRange(p,p)};
  el.querySelectorAll("[data-k]").forEach(d=>d.onclick=()=>{UI.wsel=d.dataset.k;rWk()});
  el.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>openLetter(+b.dataset.l));
}

const URG_ID=["Penipuan, pencurian, atau penggelapan barang dan/atau uang milik perusahaan","Memberikan keterangan palsu atau yang dipalsukan sehingga merugikan perusahaan","Mabuk, meminum minuman keras, memakai dan/atau mengedarkan narkotika, psikotropika, dan zat adiktif lainnya di lingkungan kerja","Melakukan perbuatan asusila atau perjudian di lingkungan kerja","Menyerang, menganiaya, mengancam, atau mengintimidasi teman sekerja atau pengusaha di lingkungan kerja","Membujuk teman sekerja atau pengusaha untuk melakukan perbuatan yang bertentangan dengan hukum atau perundang-undangan","Dengan ceroboh atau sengaja merusak atau membiarkan dalam keadaan bahaya barang milik perusahaan yang menimbulkan kerugian","Dengan ceroboh atau sengaja membiarkan teman sekerja atau pengusaha dalam keadaan bahaya di tempat kerja","Membongkar atau membocorkan rahasia perusahaan yang seharusnya dirahasiakan, kecuali untuk kepentingan negara","Melakukan perbuatan lainnya di lingkungan perusahaan yang diancam pidana penjara 5 (lima) tahun atau lebih"];

const URG_MS=["Penipuan, kecurian atau penyelewengan barang dan/atau wang milik syarikat","Memberikan maklumat palsu atau yang dipalsukan sehingga merugikan syarikat","Mabuk, minum minuman keras, menggunakan dan/atau mengedar narkotik, psikotropik dan bahan ketagihan lain di tempat kerja","Melakukan perbuatan tidak bermoral atau perjudian di tempat kerja","Menyerang, mencederakan, mengugut atau menakut-nakutkan rakan sekerja atau majikan di tempat kerja","Memujuk rakan sekerja atau majikan melakukan perbuatan yang bertentangan dengan undang-undang","Dengan cuai atau sengaja merosakkan, atau membiarkan dalam keadaan bahaya, harta syarikat sehingga menyebabkan kerugian","Dengan cuai atau sengaja membiarkan rakan sekerja atau majikan dalam keadaan bahaya di tempat kerja","Membocorkan rahsia syarikat yang sepatutnya dirahsiakan, kecuali demi kepentingan negara","Melakukan perbuatan lain di syarikat yang diancam hukuman penjara 5 (lima) tahun atau lebih"];
function rLegal(){
  const lg=S.settings.lang,L=(a,b,c)=>lg==="id"?a:lg==="ms"?c:b,m=+S.settings.months||6;
  const mw=L("bulan","months","bulan"),from=L("bulan sejak terbit","months from issue","bulan dari tarikh dikeluarkan");
  const cite=(h,body)=>'<div class="cite"><b>'+h+"</b>"+body+"</div>";
  const urg=lg==="id"?URG_ID:lg==="ms"?URG_MS:URG_EN;
  $("#tab-legal").innerHTML='<div class="card legal"><h2>'+esc(t("legal_h"))+"</h2>"
  +'<div class="note">'+L("Ringkasan informasi, bukan nasihat hukum. Periksa teks resmi di peraturan.go.id / JDIH dan peraturan perusahaan (PP) / PKB kontraktor sebelum mengambil tindakan PHK.","Information summary, not legal advice. Check the official texts at peraturan.go.id / JDIH and the contractor's company regulation (PP) / CBA (PKB) before any termination step.","Ringkasan maklumat, bukan nasihat undang-undang. Semak teks rasmi di peraturan.go.id / JDIH serta peraturan syarikat (PP) / PKB kontraktor sebelum sebarang tindakan PHK.")+"</div>"
  +"<h3>"+L("1. Tangga peringatan (SP)","1. The warning ladder (SP)","1. Tangga amaran (SP)")+'</h3><div class="tw"><table><tr><th>'+L("Tingkat","Level","Tahap")+"</th><th>"+L("Syarat terbit","Trigger","Syarat dikeluarkan")+"</th><th>"+L("Masa berlaku","Validity","Tempoh sah")+"</th><th>"+L("Akibat","Consequence","Akibat")+"</th></tr>"
  +'<tr><td>'+badge("1")+"</td><td>"+L("Pelanggaran PK / PP / PKB, tanpa SP aktif.","Breach of PK / PP / PKB with no active SP.","Pelanggaran PK / PP / PKB tanpa SP aktif.")+"</td><td>"+m+" "+mw+"</td><td>"+L("Pelanggaran lagi saat SP1 berlaku → SP2.","Another breach while SP1 is valid → SP2.","Pelanggaran lagi semasa SP1 sah → SP2.")+"</td></tr>"
  +'<tr><td>'+badge("2")+"</td><td>"+L("Pelanggaran saat SP1 masih berlaku.","Breach while SP1 is still valid.","Pelanggaran semasa SP1 masih sah.")+"</td><td>"+m+" "+from+"</td><td>"+L("Pelanggaran lagi saat SP2 berlaku → SP3.","Another breach while SP2 is valid → SP3.","Pelanggaran lagi semasa SP2 sah → SP3.")+"</td></tr>"
  +'<tr><td>'+badge("3")+"</td><td>"+L("Pelanggaran saat SP2 masih berlaku.","Breach while SP2 is still valid.","Pelanggaran semasa SP2 masih sah.")+"</td><td>"+m+" "+from+"</td><td>"+L("Pelanggaran lagi saat SP3 berlaku → PHK dapat dilakukan (Pasal 154A ayat (1) huruf k).","Another breach while SP3 is valid → PHK may follow (Pasal 154A(1)(k)).","Pelanggaran lagi semasa SP3 sah → PHK boleh dilakukan (Pasal 154A ayat (1) huruf k).")+"</td></tr>"
  +'<tr><td>'+badge("ZT")+"</td><td>"+L("Pelanggaran 'zero tolerance' proyek.","Project 'zero tolerance' breach.","Pelanggaran 'toleransi sifar' projek.")+"</td><td>—</td><td>"+L("Hanya dapat langsung PHK bila termasuk pelanggaran bersifat mendesak yang tercantum di PK/PP/PKB (Pasal 52 ayat (2)).","Immediate PHK only if it is a 'pelanggaran bersifat mendesak' listed in the PK/PP/PKB (Pasal 52(2)).","PHK serta-merta hanya jika ia 'pelanggaran bersifat mendesak' yang tersenarai dalam PK/PP/PKB (Pasal 52 ayat (2)).")+"</td></tr></table></div>"
  +"<p class='muted'>"+L("Bila masa berlaku SP sebelumnya sudah lewat, pelanggaran baru kembali dimulai dari SP1. Aplikasi ini menghitung tangga tersebut otomatis dari tanggal tiap catatan.","If the earlier SP has lapsed, a new breach restarts at SP1. This app computes the ladder automatically from each record's date.","Jika SP terdahulu telah tamat tempoh, pelanggaran baharu bermula semula pada SP1. Aplikasi ini mengira tangga ini secara automatik daripada tarikh setiap rekod.")+"</p>"
  +"<h3>"+L("2. Dasar hukum","2. Legal basis","2. Asas undang-undang")+"</h3>"
  +cite(L("UU No. 13/2003 tentang Ketenagakerjaan, sebagaimana diubah UU No. 11/2020 → Perppu No. 2/2022 → UU No. 6/2023 — Pasal 154A ayat (1) huruf k","Law 13/2003 (Manpower), as amended by Law 11/2020 → Perppu 2/2022 → Law 6/2023 — Article 154A(1)(k)","UU No. 13/2003 (Ketenagakerjaan), dipinda oleh UU No. 11/2020 → Perppu No. 2/2022 → UU No. 6/2023 — Pasal 154A ayat (1) huruf k"),L("PHK dapat terjadi bila pekerja melanggar perjanjian kerja, peraturan perusahaan, atau PKB dan sebelumnya telah diberi surat peringatan pertama, kedua, dan ketiga secara berturut-turut, masing-masing berlaku paling lama 6 (enam) bulan, kecuali ditetapkan lain dalam PK, PP, atau PKB. (Aturan lama ada di Pasal 161 UU 13/2003; sekarang diatur melalui Pasal 154A.)","Termination is possible where a worker breaches the employment agreement, company regulation or CBA and has previously received a first, second and third warning in sequence, each valid for at most 6 months, unless the PK, PP or PKB provides otherwise. (The earlier rule sat in Article 161 of Law 13/2003; it is now carried by Article 154A.)","Penamatan boleh berlaku jika pekerja melanggar perjanjian kerja, peraturan syarikat atau PKB dan sebelum itu telah menerima surat amaran pertama, kedua dan ketiga secara berturutan, masing-masing sah selama-lamanya 6 (enam) bulan, kecuali PK, PP atau PKB menetapkan lain. (Peraturan lama terdapat dalam Pasal 161 UU 13/2003; kini dibawa oleh Pasal 154A.)"))
  +cite(L("PP No. 35/2021 — Pasal 36 huruf k dan Pasal 52 ayat (1)","Gov. Reg. 35/2021 — Article 36(k) and Article 52(1)","PP No. 35/2021 — Pasal 36 huruf k dan Pasal 52 ayat (1)"),L("Menjabarkan alasan PHK karena pelanggaran ketentuan PK/PP/PKB dengan SP1–SP3 berturut-turut. Penjelasannya mengizinkan PK/PP/PKB menetapkan pelanggaran tertentu yang cukup dengan peringatan pertama dan terakhir (langsung SP3) bila dicantumkan secara tegas. Pekerja yang di-PHK karena alasan ini menerima uang pesangon 0,5×, UPMK 1×, dan UPH (perhitungan mengacu Pasal 40).","Implements termination for breach of PK/PP/PKB after SP1–SP3 in sequence. Its explanation lets the PK/PP/PKB name specific breaches that warrant a 'first and final' warning (straight to SP3) if expressly listed. A worker terminated on this ground receives severance at 0.5×, long-service pay at 1×, and entitlement compensation (UPH); amounts follow Article 40.","Menghuraikan alasan PHK kerana melanggar PK/PP/PKB selepas SP1–SP3 berturutan. Penjelasannya membenarkan PK/PP/PKB menetapkan pelanggaran tertentu yang memadai dengan amaran 'pertama dan terakhir' (terus ke SP3) jika dinyatakan dengan jelas. Pekerja yang ditamatkan atas alasan ini menerima pesangon 0.5×, UPMK 1× dan UPH; jumlah mengikut Pasal 40."))
  +cite(L("PP No. 35/2021 — Pasal 52 ayat (2)–(3): pelanggaran bersifat mendesak","Gov. Reg. 35/2021 — Article 52(2)–(3): urgent violations","PP No. 35/2021 — Pasal 52 ayat (2)–(3): pelanggaran bersifat mendesak"),L("Pengusaha dapat langsung melakukan PHK tanpa melalui SP untuk pelanggaran bersifat mendesak yang diatur dalam PK/PP/PKB. Contoh pada Penjelasan:","The employer may terminate directly, without the SP ladder, for 'urgent violations' set out in the PK/PP/PKB. Examples in the Explanation:","Majikan boleh terus melakukan PHK tanpa tangga SP bagi 'pelanggaran bersifat mendesak' yang diperuntukkan dalam PK/PP/PKB. Contoh dalam Penjelasan:")+"<ul>"+urg.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"+L("Pekerja menerima uang penggantian hak (UPH) dan uang pisah sesuai PK/PP/PKB.","The worker receives entitlement compensation (UPH) and separation pay as set out in the PK/PP/PKB.","Pekerja menerima wang penggantian hak (UPH) dan wang pisah mengikut PK/PP/PKB."))
  +cite(L("PP No. 35/2021 — Pasal 37–40: prosedur PHK","Gov. Reg. 35/2021 — Articles 37–40: termination procedure","PP No. 35/2021 — Pasal 37–40: tatacara PHK"),L("Pemberitahuan PHK disampaikan secara sah dan patut paling lambat 14 hari kerja sebelum PHK. Pekerja dapat menolak secara tertulis dengan alasan paling lambat 7 hari kerja setelah menerima pemberitahuan. Bila tidak sepakat: perundingan bipartit, lalu mekanisme penyelesaian perselisihan hubungan industrial.","Notice must be served validly and properly at least 14 working days before termination. The worker may object in writing, with reasons, within 7 working days of receiving it. If not agreed: bipartite negotiation, then the industrial-relations dispute mechanism.","Notis PHK mesti disampaikan secara sah dan wajar sekurang-kurangnya 14 hari bekerja sebelum PHK. Pekerja boleh membantah secara bertulis dengan alasan dalam masa 7 hari bekerja selepas menerima notis. Jika tidak sepakat: rundingan bipartit, kemudian mekanisme penyelesaian pertikaian perhubungan industri."))
  +cite(L("UU No. 1/1970 tentang Keselamatan Kerja — Pasal 12","Law 1/1970 (Work Safety) — Article 12","UU No. 1/1970 (Keselamatan Kerja) — Pasal 12"),L("Tenaga kerja berkewajiban memberi keterangan yang benar, memakai alat perlindungan diri yang diwajibkan, serta memenuhi dan menaati semua syarat keselamatan dan kesehatan kerja. Ini dasar substantif bahwa pelanggaran APD, izin kerja, dsb. adalah pelanggaran aturan yang dapat disanksi SP.","Workers must give truthful information, wear the required personal protective equipment, and comply with all required safety and health conditions. This is the substantive basis for treating PPE, permit and similar breaches as sanctionable rule violations.","Pekerja wajib memberi keterangan yang benar, memakai alat perlindungan diri yang diwajibkan, serta mematuhi semua syarat keselamatan dan kesihatan kerja. Ini asas substantif bahawa pelanggaran PPE, permit kerja dan sebagainya ialah pelanggaran peraturan yang boleh dikenakan SP."))
  +cite(L("Pendukung","Supporting","Sokongan"),L("PP No. 50/2012 (SMK3) dan Permenakertrans No. PER.08/MEN/VII/2010 (APD), serta aturan HSSE Shell / EcoOils yang diwajibkan kepada kontraktor.","Gov. Reg. 50/2012 (SMK3), Permenakertrans PER.08/MEN/VII/2010 (PPE), and the Shell / EcoOils HSSE rules flowed down to contractors.","PP No. 50/2012 (SMK3), Permenakertrans PER.08/MEN/VII/2010 (PPE), serta peraturan HSSE Shell / EcoOils yang diwajibkan kepada kontraktor."))
  +"<h3>"+L("3. Catatan praktis untuk proyek ini","3. Practical notes for this project","3. Nota praktikal untuk projek ini")+"</h3><ul>"
  +"<li>"+L("Pemberi kerja pekerja kontraktor (GSB, WEN, KKS, PBS, dll.) adalah kontraktor itu sendiri. SP formal menurut Pasal 52 harus diterbitkan oleh pemberi kerja menurut PP/PKB-nya. Surat dari aplikasi ini adalah peringatan keselamatan di lokasi sekaligus bahan rekomendasi bagi kontraktor.","The employer of contractor workers (GSB, WEN, KKS, PBS, etc.) is the contractor itself. A formal SP under Article 52 has to be issued by that employer under its own PP/PKB. The letter from this app is the site-level safety warning and a recommendation to the contractor.","Majikan pekerja kontraktor (GSB, WEN, KKS, PBS, dll.) ialah kontraktor itu sendiri. SP rasmi di bawah Pasal 52 mesti dikeluarkan oleh majikan mengikut PP/PKB-nya. Surat daripada aplikasi ini ialah amaran keselamatan di tapak sekali gus syor kepada kontraktor.")+"</li>"
  +"<li>"+L("Urutan SP1 → SP2 → SP3 dan masa berlaku (bawaan 6 bulan) harus sesuai PK/PP/PKB kontraktor; ubah di Pengaturan bila berbeda.","The SP1 → SP2 → SP3 sequence and validity (6 months by default) must match the contractor's PK/PP/PKB; change it in Settings if different.","Urutan SP1 → SP2 → SP3 dan tempoh sah (lalai 6 bulan) mesti sepadan dengan PK/PP/PKB kontraktor; ubah di Tetapan jika berbeza.")+"</li>"
  +"<li>"+L("Catat penerimaan: tanda tangan pekerja, atau penolakan yang disaksikan. Sumber yang ditinjau tidak menemukan kewajiban tanda tangan pekerja, tetapi bukti penyampaian melindungi proses bila terjadi sengketa.","Record receipt: the worker's signature, or a witnessed refusal. The sources reviewed found no rule requiring the worker's signature, but proof of delivery protects the process in a dispute.","Rekodkan penerimaan: tandatangan pekerja, atau keengganan yang disaksikan. Sumber yang disemak tidak menemui kewajipan tandatangan pekerja, tetapi bukti penyampaian melindungi proses jika berlaku pertikaian.")+"</li>"
  +"<li>"+L("Pelanggaran 'zero tolerance' proyek (mis. merokok di area kerja) adalah aturan proyek. Langsung PHK hanya sah bila tercakup sebagai pelanggaran bersifat mendesak dalam PK/PP/PKB kontraktor.","Project 'zero tolerance' breaches (e.g. smoking in the work area) are project rules. Immediate PHK is valid only where the contractor's PK/PP/PKB covers it as an urgent violation.","Pelanggaran 'toleransi sifar' projek (cth. merokok di kawasan kerja) ialah peraturan projek. PHK serta-merta sah hanya jika PK/PP/PKB kontraktor meliputinya sebagai pelanggaran bersifat mendesak.")+"</li>"
  +"<li>"+L("Putusan Mahkamah Konstitusi atas klaster ketenagakerjaan UU Cipta Kerja (2024) dapat mengubah redaksi; cek teks konsolidasi terbaru.","The Constitutional Court's 2024 ruling on the Job Creation Law's manpower cluster may have changed wording; check the latest consolidated text.","Keputusan Mahkamah Konstitusi 2024 mengenai kluster ketenagakerjaan UU Cipta Kerja mungkin mengubah perkataan; semak teks disatukan terkini.")+"</li></ul>"
  +"<h3>"+L("4. Sumber","4. Sources","4. Sumber")+"</h3><ul>"
  +'<li><a href="https://www.hukumonline.com/klinik/a/aturan-pemberian-surat-peringatan-karyawan-lt54f683eedcdf2" target="_blank" rel="noopener">hukumonline — Aturan pemberian surat peringatan karyawan</a></li>'

function rSet(){
  const s=S.settings,el=$("#tab-set");
  el.innerHTML='<div class="card"><h2>'+esc(t("s_h1"))+'</h2><div class="f2"><div><label>'+esc(t("s_months"))+'</label><input type="number" min="1" max="12" id="sm" value="'+s.months+'"><div class="muted">'+esc(t("s_months_h"))+'</div></div><div><label>'+esc(t("s_issuer"))+'</label><input id="si" value="'+esc(s.issuer)+'"></div><div><label>'+esc(t("s_emp"))+'</label><input id="se" value="'+esc(s.employer)+'"></div></div></div>'
   +'<div class="card"><h2>'+esc(t("s_h2"))+'</h2><div class="row"><button class="btn" id="bi">'+esc(t("s_imp"))+'</button><button class="btn sec" id="bx">'+esc(t("s_exp"))+'</button><button class="btn sec" id="bb">'+esc(t("s_bak"))+'</button><button class="btn dng" id="bc">'+esc(t("s_clr"))+'</button></div><p class="muted">'+esc(t("s_imp_h"))+"</p></div>"
   +'<div class="card"><h2>'+esc(t("s_h3"))+'</h2><div class="f2"><div><label>'+esc(t("s_url"))+'</label><input id="su" value="'+esc(s.syncUrl)+'" placeholder="https://script.google.com/macros/s/…/exec"></div><div><label>'+esc(t("s_key"))+'</label><input id="sk" value="'+esc(s.syncKey)+'"></div></div><div class="row" style="margin-top:10px"><button class="btn" id="bp">'+esc(t("s_push"))+'</button><button class="btn sec" id="bl">'+esc(t("s_pull"))+'</button></div><p class="muted">'+esc(t("s_sync_h"))+"</p></div>";
  const sv=()=>{s.months=Math.min(12,Math.max(1,+$("#sm").value||6));s.issuer=$("#si").value;s.employer=$("#se").value;s.syncUrl=$("#su").value.trim();s.syncKey=$("#sk").value;save()};
  ["sm","si","se","su","sk"].forEach(i=>$("#"+i).onchange=sv);
  $("#bi").onclick=()=>$("#fileX").click();$("#bx").onclick=exportXlsx;$("#bb").onclick=()=>download(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),"disciplinary-backup-"+todayStr()+".json");
  $("#bc").onclick=()=>{if(confirm(t("confirmclr"))){S.records=[];save();toast(t("cleared"));rSet()}};
  $("#bp").onclick=async()=>{sv();if(!S.records.length&&!confirm(t("confirmpush")))return;try{const r=await fetch(s.syncUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"replace",key:s.syncKey,records:S.records})});const j=await r.json();if(!j.ok)throw 0;toast(t("synced"))}catch(e){toast(t("sync_err"))}};
  $("#bl").onclick=async()=>{sv();try{const r=await fetch(s.syncUrl+(s.syncUrl.includes("?")?"&":"?")+"key="+encodeURIComponent(s.syncKey));const j=await r.json();if(!j.ok||!Array.isArray(j.records))throw 0;S.records=j.records.map(cleanRec).filter(Boolean);save();toast(t("synced"))}catch(e){toast(t("sync_err"))}};
}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function cleanRec(r){if(!r||!r.date||!r.name)return null;return{id:+r.id||0,date:String(r.date).slice(0,10),company:r.company||"",name:String(r.name),empId:String(r.empId||""),position:String(r.position||""),level:["1","2","3","ZT"].includes(String(r.level))?String(r.level):"1",violation:String(r.violation||""),givenBy:String(r.givenBy||""),ack:String(r.ack||"0")}}
function parseLevel(v){v=String(v||"").toLowerCase();if(/zero/.test(v))return"ZT";if(/3rd|third|final|sp\s*-?3|sp\s*-?iii|ketiga/.test(v))return"3";if(/2nd|second|sp\s*-?2|sp\s*-?ii|kedua/.test(v))return"2";return"1"}
function parseDate(v){
  if(v==null||v==="")return"";
  if(typeof v==="number"&&window.XLSX){const p=XLSX.SSF.parse_date_code(v);if(p)return iso(p.y,p.m,p.d)}
  if(v instanceof Date)return iso(v.getFullYear(),v.getMonth()+1,v.getDate());
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return iso(+m[1],+m[2],+m[3]);
  if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/))return iso(+m[3],+m[2],+m[1]);
  return"";
}
function importRows(rows,keepIds){
  const have=new Set(S.records.map(r=>[r.date,norm(r.name),norm(r.empId),norm(r.violation)].join("|")));let n=0,d=0;
  let nextId=Math.max(0,...S.records.map(r=>r.id))+1;const used=new Set(S.records.map(r=>r.id));
  rows.forEach(row=>{
    const g=(re)=>{const k=Object.keys(row).find(k=>re.test(k.trim().toLowerCase()));return k?row[k]:""};
    const rec={date:parseDate(g(/^date$/)||g(/date/)),company:String(g(/^company/)||"").trim(),name:String(g(/^name2$/)||g(/^name$/)||"").trim(),empId:String(g(/identification|^id number/)||"").trim(),position:String(g(/position|craft|designation/)||"").trim(),level:parseLevel(g(/warning count|level/)),violation:String(g(/violation/)||"").trim(),givenBy:String(g(/given by/)||"").trim(),ack:"0"};
    if(!rec.date||!rec.name)return;
    const k=[rec.date,norm(rec.name),norm(rec.empId),norm(rec.violation)].join("|");if(have.has(k)){d++;return}have.add(k);
    let id=keepIds?+g(/^id$/):0;if(!id||used.has(id))id=nextId++;used.add(id);rec.id=id;S.records.push(rec);n++;
  });
  return{n,d};
}
$("#fileX").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    if(/\.json$/i.test(f.name)){const j=JSON.parse(await f.text());const recs=(j.records||[]).map(cleanRec).filter(Boolean);const had=new Set(S.records.map(r=>[r.date,norm(r.name),norm(r.empId),norm(r.violation)].join("|")));let n=0,d=0,id=Math.max(0,...S.records.map(r=>r.id))+1;recs.forEach(r=>{const k=[r.date,norm(r.name),norm(r.empId),norm(r.violation)].join("|");if(had.has(k)){d++;return}r.id=id++;S.records.push(r);n++});save();toast(t("imp_done",{n,d}));render();return}
    if(!window.XLSX){toast(t("no_lib"));return}
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:""});const r=importRows(rows,!S.records.length);save();toast(t("imp_done",{n:r.n,d:r.d}));render();
  }catch(err){console.error(err);toast(t("imp_err"))}
};
function exportXlsx(){
  if(!window.XLSX){toast(t("no_lib"));return}
  const a=analyze();
  const rows=S.records.slice().sort((x,y)=>x.date.localeCompare(y.date)||x.id-y.id).map(r=>{const i=a.info.get(r.id);return{"ID":r.id,"Date":r.date,"Company":r.company,"Name":r.name,"Identification Number (ID)":r.empId,"Position / Craft/ Rank / Designation / Job Title":r.position,"Warning Count":r.level==="ZT"?"Zero Tolerance Violation":r.level==="1"?"1st Warning Notice":r.level==="2"?"2nd Warning Notice":"3rd Warning Notice (Final)","Describe the Safety Violation":r.violation,"Safety Warning given by":r.givenBy,"Valid until":r.level==="ZT"?"":i.until,"Active today":r.level==="ZT"?"":(i.active?"Yes":"No"),"Ladder expected":r.level==="ZT"?"":"SP"+i.exp,"Sequence check":i.status}});
  const ws=XLSX.utils.json_to_sheet(rows);
  const wr=a.workers.map(w=>({"Name":w.name,"ID":w.empId,"Company":w.company,"Records":w.total,"Zero tolerance":w.zt,"Active level":w.cur?"SP"+w.cur:"","Valid until":w.curUntil,"Last violation":w.lastDate}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Warnings");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(wr),"Workers");
  XLSX.writeFile(wb,"Disciplinary-Record-"+todayStr()+".xlsx");
}

  const dE=s=>{const [y,mo,d]=s.split("-");return +d+" "+["January","February","March","April","May","June","July","August","September","October","November","December"][+mo-1]+" "+y};

   2:["Surat peringatan ini adalah peringatan kedua. Apabila dalam masa berlakunya Saudara kembali melakukan pelanggaran, Saudara akan diberikan Surat Peringatan Ketiga dan terakhir (SP-III).","This is the second warning. If you commit another violation while it remains valid, you will be issued a Third and Final Warning (SP-III)."],
   3:["Surat peringatan ini adalah peringatan ketiga dan terakhir. Apabila dalam masa berlakunya Saudara kembali melakukan pelanggaran, Perusahaan dapat melakukan Pemutusan Hubungan Kerja (PHK) sesuai Pasal 154A ayat (1) huruf k UU No. 6 Tahun 2023 dan PP No. 35 Tahun 2021.","This is the third and final warning. If you commit another violation while it remains valid, the Company may proceed to termination of employment (PHK) under Article 154A(1)(k) of Law 6/2023 and Gov. Reg. 35/2021."],
   ZT:["Pelanggaran ini termasuk kategori zero tolerance proyek. Perusahaan dapat mengambil tindakan sesuai peraturan perusahaan, termasuk pencabutan izin masuk lokasi proyek dan/atau PHK menurut Pasal 52 ayat (2) PP No. 35 Tahun 2021 apabila pelanggaran tersebut termasuk pelanggaran bersifat mendesak yang diatur dalam perjanjian kerja, peraturan perusahaan, atau PKB.","This violation falls under the project's zero-tolerance category. The Company may take action under company regulations, including withdrawal of site access and/or termination under Article 52(2) of Gov. Reg. 35/2021 where the violation is an urgent violation listed in the employment agreement, company regulation or CBA."]}[L];

  const ack=r.ack==="1"?"✔ ":"☐ ",ref=r.ack==="2"?"✔ ":"☐ ";
  lm.innerHTML='<div class="lm-bar"><label style="margin:0">'+esc(t("lt_lang"))+'</label><select id="ll"><option value="id">'+esc(t("lt_id"))+'</option><option value="en">'+esc(t("lt_en"))+'</option><option value="both">'+esc(t("lt_both"))+'</option></select><button class="btn" id="lp">'+esc(t("print"))+'</button><button class="btn sec" id="lc">'+esc(t("close"))+'</button></div>'
  +'<div class="sheet"><div class="lh"><b>'+esc((S.settings.employer||"").toUpperCase())+"</b><div>Mentari Project · Sei Mangkei Special Economic Zone · North Sumatra</div><div>HSSE Department</div></div>"
  +"<h2>"+title+'</h2><div class="no">No. '+esc(letterNo(r))+"</div>"
  +bi("Berdasarkan pengawasan HSSE di lokasi proyek pada tanggal <b>"+dI(r.date)+"</b>, kepada:","Based on HSSE supervision at the project site on <b>"+dE(r.date)+"</b>, issued to:")
  +"<table><tr><td>"+lab("Nama","Name")+"</td><td>: <b>"+esc(r.name)+"</b></td></tr><tr><td>"+lab("No. Identitas (ID)","Identification No. (ID)")+"</td><td>: "+esc(r.empId)+"</td></tr><tr><td>"+lab("Jabatan","Position")+"</td><td>: "+esc(r.position)+"</td></tr><tr><td>"+lab("Perusahaan (pemberi kerja)","Company (employer of record)")+"</td><td>: "+esc(r.company)+"</td></tr></table>"
  +bi("tercatat melakukan pelanggaran ketentuan keselamatan kerja sebagai berikut:","is recorded as having committed the following safety violation:")
  +'<div class="box">'+esc(r.violation)+"</div>"
  +bi("Peringatan ini diterbitkan berdasarkan Pasal 154A ayat (1) huruf k UU No. 13 Tahun 2003 sebagaimana diubah dengan UU No. 6 Tahun 2023, Pasal 36 huruf k dan Pasal 52 PP No. 35 Tahun 2021, Pasal 12 UU No. 1 Tahun 1970 tentang Keselamatan Kerja, serta peraturan perusahaan/PKB dan aturan HSSE proyek yang berlaku.","This warning is issued under Article 154A(1)(k) of Law 13/2003 as amended by Law 6/2023, Articles 36(k) and 52 of Gov. Reg. 35/2021, Article 12 of Law 1/1970 on Work Safety, and the applicable company regulation/CBA and project HSSE rules.")
  +validBlock+priorBlock+bi(cons[0],cons[1])
  +bi("Surat ini dibuat untuk diperhatikan dan dipatuhi sebagaimana mestinya.","This letter is issued for your attention and compliance.")
  +'<p style="margin-top:8px">Sei Mangkei, '+(mode==="en"?dE(r.date):dI(r.date))+"</p>"
  +'<div class="sig"><div>'+lab("Diberikan oleh","Issued by")+'<br>HSSE<span>'+esc(r.givenBy)+"</span></div><div>"+lab("Penerima","Recipient")+"<br>"+ack+lab("Menerima","Received")+"<br>"+ref+lab("Menolak (saksi)","Refused (witness)")+"<span>"+esc(r.name)+"</span></div><div>"+lab("Perwakilan pemberi kerja","Employer representative")+"<br>"+esc(r.company)+"<span>&nbsp;</span></div><div>"+lab("Saksi","Witness")+"<br>&nbsp;<span>&nbsp;</span></div></div>"
  +'<div class="foot">'+(mode==="en"?"Distribution: original – worker file; copies – employer HR, HSSE. Note: a formal SP under Art. 52 must be issued by the employer of record in line with its PK/PP/PKB; this notice is the site-level safety warning and recommendation.":mode==="id"?"Distribusi: asli – berkas pekerja; tembusan – HR pemberi kerja, HSSE. Catatan: SP formal menurut Pasal 52 diterbitkan oleh pemberi kerja sesuai PK/PP/PKB-nya; surat ini adalah peringatan keselamatan di lokasi sekaligus rekomendasi.":"Distribusi / Distribution: asli/original – berkas pekerja/worker file; tembusan/copies – HR pemberi kerja/employer HR, HSSE. Catatan/Note: SP formal (Pasal 52) diterbitkan oleh pemberi kerja sesuai PK/PP/PKB / a formal SP under Art. 52 is issued by the employer of record per its PK/PP/PKB.")+"</div></div>";
  lm.classList.add("on");$("#ll").value=mode;
  $("#ll").onchange=e=>{UI.ltLang=e.target.value;drawLetter()};$("#lp").onclick=()=>window.print();$("#lc").onclick=()=>{lm.classList.remove("on");lm.innerHTML=""};
}

/* ---------- boot ---------- */
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{S.settings.lang=b.dataset.lang;save();render();if($("#lm").classList.contains("on"))drawLetter()});
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
load();go("dash");
</script>
</body>
</html>
